[package]
name = "frameatlas-cloud"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
filmcraft-oauth = { path = "../../Autocut/crates/oauth" }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
rustls-rustcrypto = { version = "0.0.2-alpha" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
